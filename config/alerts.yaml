# Alert rules (FR-08). Defaults are created on first start and can be edited (or disabled) in the Alerts
# Center. Channels: in_app, internal_email, webhook. External recipients are never alerted directly.
version: 1
internal_recipients: []          # e.g. [founder@inspironics.net]; must be in INTERNAL_EMAIL_DOMAINS
defaults:
  - name: New high-score opportunity
    kind: new_opp
    severity: info
    channels: [in_app]
    rule_expr: {min_score: 0.70, within_hours: 24}
    description: A newly discovered opportunity scored in the high band.
  - name: Deadline countdown
    kind: deadline
    severity: warning
    channels: [in_app]
    rule_expr: {offsets_days: [30, 14, 7, 2], critical_at_days: 7, bands: [high], stages: [qualified, engaged, submitted, diligence, term_sheet]}
    description: T-30/14/7/2 reminders for high-band or in-pipeline opportunities.
  - name: Overdue follow-up
    kind: follow_up
    severity: warning
    channels: [in_app]
    rule_expr: {grace_days: 0}
    description: A follow-up milestone is past its due date.
  - name: Runway below threshold
    kind: runway_risk
    severity: critical
    channels: [in_app]
    rule_expr: {months: 9}
    description: Base-case runway (forecast_engine) is below the threshold.
  - name: Commitment expiring
    kind: expiring_commitment
    severity: warning
    channels: [in_app]
    rule_expr: {within_days: 14}
    description: A recorded commitment expires within the window.
  # Outreach register (FR-04-OUT). Follow-ups created by an outreach "Sent" are milestones, so "Overdue follow-up"
  # above already covers them. Refresh cadence comes from config/outreach.yaml (30 days priority rows, 90 sources).
  - name: Outreach next action due
    kind: custom
    severity: warning
    channels: [in_app]
    rule_expr: {field: outreach_days_to_next_action, op: "<=", value: 0}
    description: An outreach next-action date has arrived (tracker on the opportunity's Outreach tab).
  - name: Outreach research stale (priority rows)
    kind: custom
    severity: info
    channels: [in_app]
    rule_expr: {field: outreach_priority_research_age_days, op: ">=", value: 30}
    description: A priority outreach row was last verified 30+ days ago; recheck the official page before contact.
  - name: Outreach sources stale
    kind: custom
    severity: info
    channels: [in_app]
    rule_expr: {field: outreach_research_age_days, op: ">=", value: 90}
    description: An outreach row's sources were last verified 90+ days ago; refresh the research.
