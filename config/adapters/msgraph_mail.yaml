# Microsoft 365 mailbox via Graph (read-only, metadata only). Opt-in: register an Entra ID app with application
# permission Mail.ReadBasic.All (admin consent), put the client secret in the env var named by auth_ref.
key: msgraph_mail
name: Microsoft 365 mailbox (Graph, read-only)
kind: mailbox
adapter: msgraph_mail
enabled: false
schedule: "*/15 * * * *"
terms_note: Your own tenant, read-only metadata (no bodies, no attachments). Only messages with known contacts are used.
auth_ref: env:MSGRAPH_CLIENT_SECRET
request:
  tenant_id: 00000000-0000-0000-0000-000000000000
  client_id: 00000000-0000-0000-0000-000000000000
  mailboxes: [founder@inspironics.net]
  since_days: 30
  self_addresses: [founder@inspironics.net]
respect_robots: false
max_items: 2000
mapping:
  external_id: external_id
  title: subject
  published_at: occurred_at
