global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/rules.yml]

scrape_configs:
  - job_name: cortex-api
    static_configs: [{targets: ["api:9464"]}]
  - job_name: cortex-worker
    static_configs: [{targets: ["worker:9464"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8889"]}]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{targets: ["keycloak:9000"]}]
