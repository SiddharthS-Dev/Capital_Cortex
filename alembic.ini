# The default section is the MySQL 8.4 history: `alembic upgrade head`. `-n mysql` is the same history, stated explicitly.
[alembic]
script_location = migrations_mysql
prepend_sys_path = .

[mysql]
script_location = migrations_mysql
prepend_sys_path = .

# PostgreSQL history, for the rollback window only: `alembic -n postgres upgrade head`.
[postgres]
script_location = migrations
prepend_sys_path = .
# URL comes from DATABASE_URL (see migrations/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
